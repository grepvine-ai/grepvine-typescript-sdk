name: Regenerate and validate SDK

on:
  workflow_dispatch:
    inputs:
      snapshot_commit:
        description: Snapshot commit pushed by Grepvine (empty uses current main)
        type: string
        required: false
  push:
    branches: [main]
    paths-ignore: ["spec/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: sdk-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      # The treeverse-ci-bot app is exempt from main's protection rules; the
      # built-in GITHUB_TOKEN cannot push to main.
      - name: Create a GitHub App token
        if: github.event_name == 'workflow_dispatch'
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.CI_BOT_CLIENT_ID }}
          private-key: ${{ secrets.CI_BOT_PRIVATE_KEY }}
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.sha }}
          token: ${{ steps.app-token.outputs.token || github.token }}
          fetch-depth: 0
      - name: Check the requested snapshot is still current
        if: github.event_name == 'workflow_dispatch' && inputs.snapshot_commit != ''
        env:
          SNAPSHOT_COMMIT: ${{ inputs.snapshot_commit }}
        run: |
          [[ "$SNAPSHOT_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          git diff --exit-code "$SNAPSHOT_COMMIT" HEAD -- spec
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run generate
      - run: npm run lint
      - run: npm test
      - name: Build and test installed package
        run: |
          npm run build
          node scripts/check-package.mjs
      - name: Check generated files in ordinary CI
        if: github.event_name != 'workflow_dispatch'
        run: git diff --exit-code -- src/generated
      - name: Commit validated generated updates
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BOT: ${{ steps.app-token.outputs.app-slug }}[bot]
        run: |
          git config user.name "$BOT"
          git config user.email "$(gh api "/users/$BOT" -q .id)+$BOT@users.noreply.github.com"
          git add src/generated
          if ! git diff --cached --quiet; then
            source_commit=$(python3 -c 'import json; print(json.load(open("spec/source.json"))["commit"])')
            git commit -m "Generate SDK from Grepvine $source_commit"
            git push origin HEAD:main
          fi
